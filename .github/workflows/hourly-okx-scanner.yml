name: Hourly OKX valuation scanner

on:
  push:
    branches: [main]
    paths:
      - "scanner.py"
      - ".github/workflows/hourly-okx-scanner.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: okx-hourly-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run scanner
        env:
          OKX_BASE_URL: https://eea.okx.com
          OKX_REQUIRE_EEA: "1"
          ALLOW_STATIC_OKX_FALLBACK: "0"
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          OKX_UNAVAILABLE_SYMBOLS: "TWLO,DKNG"
          OKX_AVAILABLE_SYMBOLS: "SOXL,MSTR,INTC,TSLA,CRCL,LITE,NVDA,NBIS,MRVL,CRWV,SPY,CBRS,EWY,MU,AMD,META,COIN,HOOD,QQQ,AAPL,GOOGL,AMZN"
          MAX_WORKERS: "6"
        run: python scanner.py

      - name: Commit refreshed report
        run: |
          git config user.name "okx-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md reports data
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "chore: hourly OKX valuation scan"
            git push
          fi
