name: Hourly OKX valuation scanner

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: okx-hourly-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run scanner
        env:
          OKX_BASE_URL: https://www.okx.com
          MAX_WORKERS: "6"
        run: python scanner.py

      - name: Commit refreshed report
        run: |
          git config user.name "okx-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports data
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "chore: hourly OKX valuation scan"
            git push
          fi
